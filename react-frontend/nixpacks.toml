# Nixpacks configuration for Railway deployment
# Prevents platform-specific dependency issues from Windows-generated package-lock.json

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
# Remove Windows-generated package-lock.json to avoid platform conflicts
# Then install fresh without optional (platform-specific) dependencies
cmds = ["rm -f package-lock.json", "npm install --omit=optional"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npx serve -s dist -l 3000"
