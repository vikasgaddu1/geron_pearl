# Nixpacks configuration for Railway deployment

[phases.setup]
nixPkgs = ["nodejs_20", "npm"]
aptPkgs = ["libatomic1"]

[phases.install]
cmds = [
  "npm ci --include=optional || npm install --include=optional"
]

[phases.build]
cmds = ["npm run build"]

# Make VITE_ variables available at build time
[variables]
VITE_API_BASE_URL = ""
VITE_WS_URL = ""

[start]
cmd = "npx serve -s dist -l $PORT"
