# Nixpacks configuration for Railway deployment
# Prevents platform-specific dependency issues from Windows-generated package-lock.json

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
# Clean install - remove any cached files that might have Windows deps
cmds = ["rm -rf node_modules package-lock.json", "npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npx serve -s dist -l 3000"
